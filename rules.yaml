live_controls:
  killswitch:
    drawdown_soft_pct: -10
    drawdown_hard_pct: -15
validation:
  leverage:
    enable_only_if_maxdd_in_leq_pct: 15
    leverage_cap: 1.3
  turnover:
    annual_max: 500
  costs_exec:
    slip_model: default_v1
    replay_mae_bps_max: 2
  walk_forward:
    windows:
    - 6
    - 12
    - 24
    wf_pass_min: 0.80
  freshness:
    relaxed_event_datasets:
    - dividend
    trading_days_lag_max:
      dividend: 120
      default: 2
  regime:
    required:
    - trend_up
    - vol_up
    - liq_up
  alpha_quality:
    psr_min: 0.9
    dsr_min_after_costs: 0
    t_stat_min: 2
    rank_ic_weekly_min: 0.03
  risk:
    vol_target_pct:
    - 10
    - 12
    max_drawdown_pct: 20
    adv_participation_max_pct: 5
    weight_single_name_max_pct: 5
ssot:
  week_anchor: W-FRI
  schema_ver: 2025_09_29
  tz: Asia/Taipei

# BEGIN AUTO FRESHNESS (managed) - do not edit below
checks:
  freshness:
    # 當前 Preflight 採用：max_date >= expect_date 視為 OK
    operator: ge
    datasets: [prices, chip, per, dividend]
    # 支援兩種分區樣式；月份分區會從檔內 date 欄取最大值
    partition_patterns:
      - "date=YYYY-MM-DD"
      - "yyyymm=YYYYMM"
# END AUTO FRESHNESS (managed)
phase6:
  cash:
    buffer_bps: 10
    max_cash_usage_ratio: 1.0
  concentration:
    max_single_name_ratio: 0.20
    topk_k: 5
    max_topk_ratio: 0.60
  turnover:
    max_turnover_ratio: 1.00
  freshness:
    max_price_age_days: 7
    max_snapshot_age_days: 7
  benchmark:
    returns_file: "reports/benchmarks/bench_0050_returns.parquet"
  risk:
    te_windows: [60, 120, 252]
    min_obs: 10
    enforce_te: false
    enforce_ir: false
    max_te:
      "252": 0.10
    min_ir:
      "252": -999
    max_single_name_rc: 0.20
    max_topk_rc: 0.60
    topk_k: 5
  overlay:
    enabled: true
    policy: "scale"
    trigger_on_warn_te: true
