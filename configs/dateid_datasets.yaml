# File: config/dateid_datasets.yaml
# SSOT for Phase-1 dateID datasets.
# 六個 dataset key 必須完整且與 EXPECTED_KEYS 相同：
#   finstmt, bs, cfs, shareholding, inst_total, gov_bank

dateid_datasets:
  finstmt:
    key: finstmt
    finmind_name: TaiwanStockFinancialStatements
    # 相對於 datahub-root 的路徑；目前銀河位置：datahub/silver/alpha/finstmt
    output_root: silver/alpha/finstmt
    # 可用資料最早日期（可依實際情況調整）
    min_date: 2004-01-01
    enabled: true
    frequency: quarterly
    required_columns:
      - date
      - stock_id

  bs:
    key: bs
    finmind_name: TaiwanStockBalanceSheet
    output_root: silver/alpha/bs
    min_date: 2004-01-01
    enabled: true
    frequency: quarterly
    required_columns:
      - date
      - stock_id

  cfs:
    key: cfs
    finmind_name: TaiwanStockCashFlowsStatement
    output_root: silver/alpha/cfs
    min_date: 2004-01-01
    enabled: true
    frequency: quarterly
    required_columns:
      - date
      - stock_id

  shareholding:
    key: shareholding
    finmind_name: TaiwanStockShareholding
    output_root: silver/alpha/shareholding
    min_date: 2004-01-01
    enabled: true
    frequency: daily
    required_columns:
      - date
      - stock_id

  inst_total:
    key: inst_total
    finmind_name: TaiwanStockTotalInstitutionalInvestors
    output_root: silver/alpha/inst_total
    min_date: 2004-01-01
    enabled: true
    frequency: daily
    required_columns:
      - date
      - stock_id

  gov_bank:
    key: gov_bank
    finmind_name: TaiwanStockGovernmentBankBuySell
    output_root: silver/alpha/gov_bank
    min_date: 2004-01-01
    enabled: true
    frequency: daily
    required_columns:
      - date
      - stock_id
